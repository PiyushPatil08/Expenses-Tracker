<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget App</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>



  <div class="navbar">
    <h1>Expense Tracker</h1>
  </div>
  <div id="start">
    <h1>Manage Your Expenses Like Never Before</h1>
    <button id="startbtn">Manage Now</button>
  </div>

  <div id="error">
    <label id="err-msg">Expenses excedes Budget</label>
    <button id="back">Go Back</button>
  </div>

  <div id="reminder">
    <label id="msg"></label>
    <button id="ok">Okay</button>
  </div>
  
  <div id="setR">
    <label id="R-msg">Enter the amount when you want remainder if expenses crosses it </label>
    <input type="number" id="input-box">
    <button id="set-back">Set Remainder</button>
  </div>

  <div id="main">
    <div class="wrapper">
      <div class="container">
        <div class="sub-container">
          <!-- Budget -->
          <div class="total-amount-container">
            <h3>Budget</h3>
            <p class="hide error" id="budget-error">
              Value cannot be empty or negative
            </p>
            <input type="number" id="total-amount" placeholder="Enter Total Amount" />
            <div class="twobtn">
              <button class="submit budget" id="total-amount-button" >Set Budget</button>
              <button class="submit" id="reminderbtn">Set Reminder</button>
            </div>
          </div>

          <!-- Expenditure -->
          <div class="user-amount-container">
            <h3>Expenses</h3>
            <p class="hide error" id="product-title-error">
              Values cannot be empty
            </p>
            <input type="text" class="product-title" id="product-title" placeholder="Enter Title of Product" />
            <input type="number" id="user-amount" placeholder="Enter Cost of Product" />
            <button class="submit" id="check-amount">Check Amount</button>
          </div>
        </div>
        <!-- Output -->
        <div class="output-container flex-space">
          <div>
            <p>Total Budget</p>
            <span id="amount">0</span>
          </div>
          <div>
            <p>Expenses</p>
            <span id="expenditure-value">0</span>
          </div>
          <div>
            <p>Balance</p>
            <span id="balance-amount">0</span>
          </div>
        </div>
      </div>
      <!-- List -->
      <div class="list">
        <h3>Expense List</h3>
        <div class="list-container" id="list"></div>
      </div>
    </div>

  </div>
  <!-- Script -->
  <script src="script.js"></script>
</body>

</html>
